# Scheduler resources and tool-level defaults for the SGB assembly workflow.
# memory_mb is passed to anadama2 as scheduler memory in MB.

[kneaddata]
threads = 4
memory_mb = 16000
partition = low
sequencer_source = TruSeq3
run_fastqc_start = true
run_fastqc_end = true
extra_args =

[assembly]
threads = 24
memory_mb = 300000
partition = smp01
extra_args =

[binning]
threads = 16
memory_mb = 32000
partition = smp01
min_contig = 1500
bowtie2_extra_args =
metabat_extra_args =

[drep]
threads = 32
memory_mb = 128000
partition = smp01
completeness = 50
contamination = 5
secondary_ani = 0.95
primary_ani = 0.90
coverage = 0.30
extra_args =

[quantification]
threads = 16
memory_mb = 64000
partition = smp01
coverm_method = relative_abundance
coverm_extra_args =

[gtdbtk]
threads = 32
memory_mb = 450000
partition = smp01
marker_set = bac120
skip_ani_screen = true
infer_tree = true
infer_memory_mb = 128000
extra_args =
