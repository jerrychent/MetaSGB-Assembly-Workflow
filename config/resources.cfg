# Scheduler resources and tool-level defaults for the SGB assembly workflow.
# threads is passed to tools; scheduler_cores is requested from Slurm.
# Use scheduler_cores >= max(threads, ceil(memory_mb / 3000)) for 1 core ~ 3 GB clusters.

[kneaddata]
threads = 12
scheduler_cores = 12
memory_mb = 16000
partition = I6230R_384G
sequencer_source = TruSeq3
run_fastqc_start = true
run_fastqc_end = true
extra_args =

[assembly]
threads = 24
scheduler_cores = 52
memory_mb = 200000  # recommended 300 Gb 
partition = I6230R_384G
extra_args =

[binning]
threads = 16
scheduler_cores = 16
memory_mb = 32000
partition = I6230R_384G
min_contig = 1500
bowtie2_extra_args = --very-sensitive-local
metabat_extra_args =

[drep]
threads = 32
scheduler_cores = 43
memory_mb = 128000
partition = I6230R_384G
completeness = 50
contamination = 5
secondary_ani = 0.95
primary_ani = 0.90
coverage = 0.30
extra_args =

[quantification]
threads = 16
scheduler_cores = 22
memory_mb = 64000
partition = I6230R_384G
bowtie2_extra_args = --very-sensitive-local
coverm_method = relative_abundance
coverm_extra_args =

[phylophlan_sgb]
threads = 36
scheduler_cores = 36
memory_mb = 64000
partition = I6230R_384G
database_folder = /public/home/chenhaotian/software/phylophlan_databases
database = SGB.Jan25
input_extension = .fa
nproc_io = 36
clean = false
extra_args =
